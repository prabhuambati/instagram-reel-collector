<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reel Music Collection</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end}.muted{color:#667085}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.card{background:#fff;border:1px solid #e3e8ef;border-radius:12px;padding:16px 22px;min-width:120px}.card b{display:block;font-size:25px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #e3e8ef;border-radius:12px;padding:14px}.toolbar input,.toolbar select,.toolbar button{padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.toolbar button{cursor:pointer}.table{overflow:auto;background:#fff;border:1px solid #e3e8ef;border-radius:12px;margin-top:16px}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{padding:12px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}th{font-size:12px;text-transform:uppercase;color:#667085}a{color:#175cd3;text-decoration:none}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#eef4ff;font-size:12px}.review{background:#fff6ed}.accepted{background:#ecfdf3}.duplicate{background:#f2f4f7}.empty{padding:40px;text-align:center}.thumb{width:32px;height:32px;object-fit:cover;border-radius:50%;vertical-align:middle;margin-right:6px}.small{font-size:12px}.actions button{font-size:12px;padding:5px;margin-right:4px}
</style></head><body><main class="wrap"><div class="top"><div><h1>Instagram Reel Music Collection</h1><div class="muted">Local-only searchable collection with creator attribution and review queue</div></div><div><button onclick="downloadExport('csv')">Export credits CSV</button> <button onclick="downloadExport('json')">Export credits JSON</button></div></div><section class="cards"><div class="card"><span class="muted">Total</span><b id="total">0</b></div><div class="card"><span class="muted">Review</span><b id="review">0</b></div><div class="card"><span class="muted">Accepted</span><b id="accepted">0</b></div><div class="card"><span class="muted">Duplicates</span><b id="duplicates">0</b></div></section><section class="toolbar"><input id="q" placeholder="Search song, creator, caption, source..." oninput="load()"><select id="status" onchange="load()"><option value="">All statuses</option><option value="review">Review</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option><option value="duplicate">Duplicate</option></select><label>Import extension JSON <input id="file" type="file" accept=".json"></label><button onclick="importFile()">Import</button><span id="msg" class="muted"></span></section><div class="table"><table><thead><tr><th>Creator</th><th>Song</th><th>Performance</th><th>Source / attribution</th><th>Confidence</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty muted" hidden>No records yet. Export visible reels from the extension and import the JSON file.</div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const q=encodeURIComponent(document.querySelector('#q').value),status=encodeURIComponent(document.querySelector('#status').value);const [rs,ss]=await Promise.all([fetch(`/api/reels?q=${q}&status=${status}`).then(r=>r.json()),fetch('/api/stats').then(r=>r.json())]);for(const k of ['total','review','accepted','duplicates'])document.querySelector('#'+k).textContent=ss[k];document.querySelector('#empty').hidden=rs.length>0;document.querySelector('#rows').innerHTML=rs.map(r=>`<tr><td>${r.profile_photo_url?`<img class="thumb" src="${esc(r.profile_photo_url)}">`:''}<a href="${esc(r.profile_url||'#')}" target="_blank">@${esc(r.username||'unknown')}</a><div class="small">${esc(r.instagram_id||'')}</div></td><td><b>${esc(r.song_title||'Unidentified')}</b><div class="small">${esc(r.song_artist||'')}</div></td><td><span class="pill">${esc(r.performance_type)}</span> ${esc(r.instrument||'')}</td><td><a href="${esc(r.reel_url)}" target="_blank">Open reel</a><div class="small">${esc(r.source_kind)}: ${esc(r.source_query)}</div><div class="small">${esc(r.caption||'').slice(0,160)}</div></td><td>${Math.round((r.classifier_confidence||0)*100)}% combined<br>${Math.round((r.visual_confidence||0)*100)}% visual<br>${Math.round((r.audio_confidence||0)*100)}% audio<br>${Math.round((r.recognition_confidence||0)*100)}% song</td><td><span class="pill ${esc(r.status)}">${esc(r.status)}</span>${r.mp3_path?'<div class="small">MP3 ready</div>':''}</td><td class="actions"><button onclick="setStatus('${r.id}','accepted')">Accept</button><button onclick="setStatus('${r.id}','rejected')">Reject</button><button onclick="setStatus('${r.id}','duplicate')">Duplicate</button></td></tr>`).join('')}
async function setStatus(id,status){await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});load()}
async function importFile(){const f=document.querySelector('#file').files[0];if(!f)return;const payload=JSON.parse(await f.text());const result=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json());document.querySelector('#msg').textContent=`Imported: ${JSON.stringify(result)}`;load()}
function downloadExport(fmt){window.location.href=`/export/${fmt}`}
load();
</script></body></html>
